packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@eslint/json@2.1.0"
  - globals@17.12.0
  - "@types/node@26.4.1 || 26.5.0"
  - "@effect/tsgo-darwin-arm64@0.43.0"
  - "@effect/tsgo-darwin-x64@0.43.0"
  - "@effect/tsgo-linux-arm64@0.43.0"
  - "@effect/tsgo-linux-arm@0.43.0"
  - "@effect/tsgo-linux-x64@0.43.0"
  - "@effect/tsgo-win32-arm64@0.43.0"
  - "@effect/tsgo-win32-x64@0.43.0"
  - "@effect/tsgo@0.43.0"
  - "@typescript-eslint/eslint-plugin@8.70.0"
  - "@typescript-eslint/parser@8.70.0"
  - "@typescript-eslint/project-service@8.70.0"
  - "@typescript-eslint/scope-manager@8.70.0"
  - "@typescript-eslint/tsconfig-utils@8.70.0"
  - "@typescript-eslint/type-utils@8.70.0"
  - "@typescript-eslint/types@8.70.0"
  - "@typescript-eslint/typescript-estree@8.70.0"
  - "@typescript-eslint/utils@8.70.0"
  - "@typescript-eslint/visitor-keys@8.70.0"
  - typescript-eslint@8.70.0
  - prettier@3.9.9

savePrefix: ""
