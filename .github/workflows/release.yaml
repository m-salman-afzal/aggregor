name: Release

# Merging the release PR (dev -> main, opened by release-pr.yaml) tags the merge commit with v<version>,
# builds the .vsix, publishes it to the Marketplace and creates the GitHub release with it attached.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  Release:
    if: github.event.pull_request.merged && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    environment: marketplace
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
          require-lockfile: true
      # vsce runs vscode:prepublish, which only builds. Lint and typecheck already ran in checks.yaml on every branch.
      - name: Package extension
        run: pnpm vsix
      # Before the release, so a failed run can be re-run: --skip-duplicate skips an already published version.
      - name: Publish to Marketplace
        working-directory: apps/extension
        run: pnpm exec vsce publish --packagePath *.vsix --skip-duplicate --oidc
      # Creates the tag on the merge commit too. Fails if v<version> already exists, i.e. the version was not bumped.
      - name: Create release
        run:
          gh release create "v$(pnpm --silent release:version)" apps/extension/*.vsix --target "$(git rev-parse HEAD)"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
