name: Release

# Builds the .vsix and attaches it to the GitHub release, next to the source code archives.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  Attach-VSIX:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # The .vsix is named from package.json, so a tag that disagrees would ship a mislabeled build.
      - name: Check tag matches extension version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          [ "${TAG#v}" = "$version" ] || { echo "::error::Tag $TAG does not match apps/extension version $version"; exit 1; }
        env:
          TAG: ${{ github.event.release.tag_name }}
      # vsce runs vscode:prepublish, which typechecks, lints and builds first.
      - name: Package extension
        run: pnpm vsix
      - name: Upload to release
        run: gh release upload "$TAG" apps/extension/*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
