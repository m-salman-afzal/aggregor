name: Release

# Merging the release PR (dev -> main, opened by pnpm release:pr) tags the merge commit with v<version>,
# builds the .vsix and creates the GitHub release with it attached.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  Release:
    if: github.event.pull_request.merged && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      # vsce runs vscode:prepublish, which typechecks, lints and builds first.
      - name: Package extension
        run: pnpm vsix
      # Creates the tag on the merge commit too. Fails if v<version> already exists, i.e. the version was not bumped.
      - name: Create release
        run:
          gh release create "v$(pnpm --silent release:version)" apps/extension/*.vsix --target "$(git rev-parse HEAD)"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
