name: Checks

# Every branch push except main and dev. Those two only receive code that was already checked on its branch.
on:
  push:
    branches-ignore: [main, dev]

# A newer push to the same branch cancels the run in flight.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per check so they run in parallel and fail independently.
  Check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        script: [lint:check, format:check, typecheck, test, db:check, pty:check, pty:test, vsix]
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs pnpm and Node from package.json (packageManager, devEngines.runtime), then runs pnpm install.
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
          require-lockfile: true
      # The runner has rustup; this installs the toolchain apps/pty/rust-toolchain.toml pins.
      - if: startsWith(matrix.script, 'pty:') || matrix.script == 'vsix'
        working-directory: apps/pty
        run: rustup toolchain install
      # Packaged with aggregor-pty built for the runner, as the linux-x64 release is.
      - if: matrix.script == 'vsix'
        run: pnpm --filter=aggregor-app build:pty
      - run: pnpm run ${{ matrix.script }}
