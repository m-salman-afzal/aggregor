name: Checks

# Every branch push except main and dev. Those two only receive code that was already checked on its branch.
on:
  push:
    branches-ignore: [main, dev]

# A newer push to the same branch cancels the run in flight.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per check so they run in parallel and fail independently.
  Check:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        script: [lint:check, format:check, typecheck, vsix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Installs pnpm and Node from package.json (packageManager, devEngines.runtime), then runs pnpm install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm run ${{ matrix.script }}
