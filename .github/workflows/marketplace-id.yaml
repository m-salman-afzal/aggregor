name: Marketplace ID

# One-time: prints the managed identity's Marketplace ID to add as a publisher member. Delete once that's done.
on: push

permissions:
  id-token: write

jobs:
  Print-ID:
    runs-on: ubuntu-latest
    environment: marketplace
    timeout-minutes: 5
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # Only the identity itself can read this ID. 499b84ac-... is Azure DevOps' fixed resource ID, the same for everyone.
      - run:
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource
          499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
