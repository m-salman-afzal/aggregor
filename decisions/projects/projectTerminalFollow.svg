<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d">
<title id="t">How the Terminal panel follows the shown folder</title>
<desc id="d">Five steps: opening a project terminal remembers it; a session tab becoming active is ignored; a project switch shows the new project's terminal in place of another project's; a worktree session shows its worktree's terminal; a shell of your own is left in front.</desc>
<style>:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--line:#d0d7de;--panel:#f6f8fa;--accent:#0969da;--accentSoft:#ddf4ff;--warn:#9a6700;--ok:#1a7f37}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8d96a0;--line:#30363d;--panel:#161b22;--accent:#4493f8;--accentSoft:#12263f;--warn:#d29922;--ok:#3fb950}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{fill:var(--muted)} .box{fill:var(--panel);stroke:var(--line)} .bg{fill:var(--bg)}
.hl{fill:none;stroke:var(--accent);stroke-width:2.5;animation:pulse 1.2s ease-in-out infinite}
.chip{fill:var(--accentSoft);stroke:var(--accent)} .note{fill:var(--warn)} .acc{fill:var(--accent)}
@keyframes pulse{50%{opacity:.25}}
.f{opacity:0}
@keyframes k0{0%{opacity:0}0.00%{opacity:0}0.50%{opacity:1}19.50%{opacity:1}20.00%{opacity:0}100%{opacity:0}}
.f0{animation:k0 25s linear infinite}
@keyframes k1{0%{opacity:0}20.00%{opacity:0}20.50%{opacity:1}39.50%{opacity:1}40.00%{opacity:0}100%{opacity:0}}
.f1{animation:k1 25s linear infinite}
@keyframes k2{0%{opacity:0}40.00%{opacity:0}40.50%{opacity:1}59.50%{opacity:1}60.00%{opacity:0}100%{opacity:0}}
.f2{animation:k2 25s linear infinite}
@keyframes k3{0%{opacity:0}60.00%{opacity:0}60.50%{opacity:1}79.50%{opacity:1}80.00%{opacity:0}100%{opacity:0}}
.f3{animation:k3 25s linear infinite}
@keyframes k4{0%{opacity:0}80.00%{opacity:0}80.50%{opacity:1}99.50%{opacity:1}100.00%{opacity:0}100%{opacity:0}}
.f4{animation:k4 25s linear infinite}
@media (prefers-reduced-motion: reduce){.hl{animation:none}}</style>
<rect class="bg" width="760" height="400" rx="10"/>
<rect class="box" x="16" y="16" width="220" height="280" rx="8"/>
<text x="30" y="40" font-size="11" font-weight="700" class="muted">AGGREGOR · SESSIONS</text>
<rect class="box" x="252" y="16" width="492" height="150" rx="8"/>
<text x="266" y="40" font-size="11" font-weight="700" class="muted">EDITOR AREA (session tabs)</text>
<rect class="box" x="252" y="180" width="492" height="116" rx="8"/>
<text x="266" y="202" font-size="11" font-weight="700" class="muted">TERMINAL PANEL</text>
<text x="728" y="202" font-size="15" text-anchor="end" class="muted">+</text>
<g class="f f0">
<rect x="24" y="52" width="204" height="24" rx="6" fill="var(--accentSoft)"/>
<text x="34" y="68" font-size="13" font-weight="600">▾ projA</text>
<text x="196" y="68" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="94" font-size="12">projA #1</text>
<text x="34" y="130" font-size="13" font-weight="600">▾ jsTester</text>
<text x="196" y="130" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="156" font-size="12">jsTester #2</text>
<text x="50" y="178" font-size="12">jsTester #3 <tspan class="muted">⎇</tspan></text>
<text x="30" y="200" font-size="10.5" class="muted">shown folder:</text>
<text x="30" y="218" font-size="13" font-weight="700" class="acc">projA</text>
<text x="266" y="70" font-size="12" class="muted">(no session tab in front)</text>
<text x="266" y="232" font-size="14" class="mono">projA · zsh</text>
<text x="266" y="254" font-size="11" class="mono muted">env: AGGREGOR_FOLDER_PATH=projA</text>
<rect class="chip" x="24" y="240" width="204" height="46" rx="8"/>
<text x="34" y="258" font-size="10.5" class="muted">Aggregor remembers (Ref):</text>
<text x="34" y="276" font-size="12.5" font-weight="700" class="mono">projA · zsh</text>
<text x="732" y="274" font-size="11" text-anchor="end" class="note">active, not a session tab → remembered</text>
<rect class="hl" x="186" y="54" width="32" height="20" rx="5"/>
<text x="20" y="330" font-size="12.5">1 · Open Terminal on projA&#x27;s row opens projA&#x27;s own terminal (its env carries AGGREGOR_FOLDER_PATH).</text>
<text x="20" y="350" font-size="12.5">It becomes VS Code&#x27;s active terminal and isn&#x27;t a session tab, so Aggregor remembers it as the panel&#x27;s.</text>
</g>
<g class="f f1">
<rect x="24" y="52" width="204" height="24" rx="6" fill="var(--accentSoft)"/>
<text x="34" y="68" font-size="13" font-weight="600">▾ projA</text>
<text x="196" y="68" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="94" font-size="12">projA #1</text>
<text x="34" y="130" font-size="13" font-weight="600">▾ jsTester</text>
<text x="196" y="130" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="156" font-size="12">jsTester #2</text>
<text x="50" y="178" font-size="12">jsTester #3 <tspan class="muted">⎇</tspan></text>
<text x="30" y="200" font-size="10.5" class="muted">shown folder:</text>
<text x="30" y="218" font-size="13" font-weight="700" class="acc">projA</text>
<rect x="266" y="52" width="120" height="26" rx="5" fill="var(--accentSoft)" stroke="var(--accent)"/>
<text x="276" y="70" font-size="12">⬚ jsTester #2</text>
<text x="266" y="104" font-size="11" class="muted">VS Code’s activeTerminal = this session tab</text>
<text x="266" y="232" font-size="14" class="mono">projA · zsh</text>
<text x="266" y="254" font-size="11" class="mono muted">env: AGGREGOR_FOLDER_PATH=projA</text>
<rect class="chip" x="24" y="240" width="204" height="46" rx="8"/>
<text x="34" y="258" font-size="10.5" class="muted">Aggregor remembers (Ref):</text>
<text x="34" y="276" font-size="12.5" font-weight="700" class="mono">projA · zsh</text>
<text x="732" y="274" font-size="11" text-anchor="end" class="note">session tab became active → ignored</text>
<rect class="hl" x="42" y="140" width="120" height="22" rx="5"/>
<text x="20" y="330" font-size="12.5">2 · You click jsTester #2. Its session tab comes to the front and is now VS Code&#x27;s active terminal,</text>
<text x="20" y="350" font-size="12.5">but session tabs (AGGREGOR_SESSION_ID) are skipped, so the remembered terminal stays projA&#x27;s.</text>
</g>
<g class="f f2">
<text x="34" y="68" font-size="13" font-weight="600">▾ projA</text>
<text x="196" y="68" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="94" font-size="12">projA #1</text>
<rect x="24" y="114" width="204" height="24" rx="6" fill="var(--accentSoft)"/>
<text x="34" y="130" font-size="13" font-weight="600">▾ jsTester</text>
<text x="196" y="130" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="156" font-size="12">jsTester #2</text>
<text x="50" y="178" font-size="12">jsTester #3 <tspan class="muted">⎇</tspan></text>
<text x="30" y="200" font-size="10.5" class="muted">shown folder:</text>
<text x="30" y="218" font-size="13" font-weight="700" class="acc">jsTester</text>
<rect x="266" y="52" width="120" height="26" rx="5" fill="var(--accentSoft)" stroke="var(--accent)"/>
<text x="276" y="70" font-size="12">⬚ jsTester #2</text>
<text x="266" y="232" font-size="14" class="mono">jsTester · zsh</text>
<text x="266" y="254" font-size="11" class="mono muted">env: AGGREGOR_FOLDER_PATH=jsTester</text>
<rect class="chip" x="24" y="240" width="204" height="46" rx="8"/>
<text x="34" y="258" font-size="10.5" class="muted">Aggregor remembers (Ref):</text>
<text x="34" y="276" font-size="12.5" font-weight="700" class="mono">jsTester · zsh</text>
<text x="732" y="274" font-size="11" text-anchor="end" class="note">shown in projA&#x27;s place → remembered</text>
<rect class="hl" x="258" y="214" width="200" height="26" rx="5"/>
<text x="20" y="330" font-size="12.5">3 · The shown project switches to jsTester. The remembered terminal belongs to another project,</text>
<text x="20" y="350" font-size="12.5">so jsTester&#x27;s terminal is shown in its place, without taking focus. (No terminal yet → nothing opens.)</text>
</g>
<g class="f f3">
<text x="34" y="68" font-size="13" font-weight="600">▾ projA</text>
<text x="196" y="68" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="94" font-size="12">projA #1</text>
<text x="34" y="130" font-size="13" font-weight="600">▾ jsTester</text>
<text x="196" y="130" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="156" font-size="12">jsTester #2</text>
<rect x="24" y="164" width="204" height="22" rx="6" fill="var(--accentSoft)"/>
<text x="50" y="178" font-size="12">jsTester #3 <tspan class="muted">⎇</tspan></text>
<text x="30" y="200" font-size="10.5" class="muted">shown folder:</text>
<text x="30" y="218" font-size="13" font-weight="700" class="acc">jsTester #3&#x27;s worktree</text>
<rect x="266" y="52" width="120" height="26" rx="5" fill="var(--accentSoft)" stroke="var(--accent)"/>
<text x="276" y="70" font-size="12">⬚ jsTester #3</text>
<text x="266" y="232" font-size="14" class="mono">jsTester · jstester-3 · zsh</text>
<text x="266" y="254" font-size="11" class="mono muted">env: AGGREGOR_FOLDER_PATH=…/worktrees/jstester-3</text>
<rect class="chip" x="24" y="240" width="204" height="46" rx="8"/>
<text x="34" y="258" font-size="10.5" class="muted">Aggregor remembers (Ref):</text>
<text x="34" y="276" font-size="12.5" font-weight="700" class="mono">jsTester · jstester-3</text>
<text x="732" y="274" font-size="11" text-anchor="end" class="note">worktree&#x27;s own terminal → remembered</text>
<rect class="hl" x="258" y="214" width="240" height="26" rx="5"/>
<text x="20" y="330" font-size="12.5">4 · You click jsTester #3, a worktree session; its row&#x27;s &gt;_ opened a terminal in the worktree.</text>
<text x="20" y="350" font-size="12.5">It is shown in jsTester&#x27;s place; a worktree with no terminal of its own falls back to the project&#x27;s.</text>
</g>
<g class="f f4">
<text x="34" y="68" font-size="13" font-weight="600">▾ projA</text>
<text x="196" y="68" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="94" font-size="12">projA #1</text>
<rect x="24" y="114" width="204" height="24" rx="6" fill="var(--accentSoft)"/>
<text x="34" y="130" font-size="13" font-weight="600">▾ jsTester</text>
<text x="196" y="130" font-size="11" class="mono muted">&gt;_</text>
<text x="50" y="156" font-size="12">jsTester #2</text>
<text x="50" y="178" font-size="12">jsTester #3 <tspan class="muted">⎇</tspan></text>
<text x="30" y="200" font-size="10.5" class="muted">shown folder:</text>
<text x="30" y="218" font-size="13" font-weight="700" class="acc">jsTester</text>
<rect x="266" y="52" width="120" height="26" rx="5" fill="var(--accentSoft)" stroke="var(--accent)"/>
<text x="276" y="70" font-size="12">⬚ jsTester #2</text>
<text x="266" y="232" font-size="14" class="mono">zsh (your own)</text>
<text x="266" y="254" font-size="11" class="mono muted">env: no AGGREGOR_* mark</text>
<rect class="chip" x="24" y="240" width="204" height="46" rx="8"/>
<text x="34" y="258" font-size="10.5" class="muted">Aggregor remembers (Ref):</text>
<text x="34" y="276" font-size="12.5" font-weight="700" class="mono">zsh (your own)</text>
<text x="732" y="274" font-size="11" text-anchor="end" class="note">no folder mark → remembered</text>
<rect class="hl" x="716" y="186" width="20" height="22" rx="5"/>
<text x="20" y="330" font-size="12.5">5 · You open a shell with the panel&#x27;s +. It has no folder mark, so when the shown folder changes</text>
<text x="20" y="350" font-size="12.5">again, Aggregor leaves it in front: it only ever replaces another folder&#x27;s terminal.</text>
</g>
<circle cx="340.0" cy="384" r="4" fill="var(--line)"/>
<circle class="f f0" cx="340.0" cy="384" r="4" fill="var(--accent)"/>
<circle cx="360.0" cy="384" r="4" fill="var(--line)"/>
<circle class="f f1" cx="360.0" cy="384" r="4" fill="var(--accent)"/>
<circle cx="380.0" cy="384" r="4" fill="var(--line)"/>
<circle class="f f2" cx="380.0" cy="384" r="4" fill="var(--accent)"/>
<circle cx="400.0" cy="384" r="4" fill="var(--line)"/>
<circle class="f f3" cx="400.0" cy="384" r="4" fill="var(--accent)"/>
<circle cx="420.0" cy="384" r="4" fill="var(--line)"/>
<circle class="f f4" cx="420.0" cy="384" r="4" fill="var(--accent)"/>
</svg>
