<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#424242">
  <style>
    .sparkle {
      transform-origin: 8px 5px;
      animation: bloom 1.6s ease-in-out infinite;
    }
    .dot-l {
      transform-origin: 4px 13px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dot-r {
      transform-origin: 12px 13px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes bloom {
      0%, 100% { transform: scale(0.78); opacity: 0.78; }
      50%      { transform: scale(1.22); opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1.35); opacity: 1; }
      50%      { transform: scale(0.6);  opacity: 0.55; }
    }
  </style>
  <g class="sparkle">
    <path d="M 8 0.5 L 8.9 4.1 L 12.5 5 L 8.9 5.9 L 8 9.5 L 7.1 5.9 L 3.5 5 L 7.1 4.1 Z"/>
  </g>
  <path d="M 8 9.5 L 4 13"  stroke="#424242" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M 8 9.5 L 12 13" stroke="#424242" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle class="dot-l" cx="4"  cy="13" r="1.6"/>
  <circle class="dot-r" cx="12" cy="13" r="1.6"/>
</svg>
