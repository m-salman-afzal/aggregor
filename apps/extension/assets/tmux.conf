# Aggregor's own tmux server (on <aggregor folder>/tmux.sock) reads this file instead of ~/.tmux.conf. Each tmux session
# holds one Aggregor session's agent, or one folder's shell, and a VS Code terminal is a tmux client attached to it.

# No prefix and no status bar: the tab should feel like the agent alone.
set -g prefix None
unbind-key C-b
set -g status off

# tmux only keeps what runs in a terminal and shows it there, so a terminal acts like a plain one: no key or mouse opens a
# menu, a split, a floating pane or another window. The mouse keeps what a terminal does with it: the wheel scrolls back,
# a drag, double click or triple click copies, a middle click pastes, and an app that asks for the mouse gets it.
unbind-key -a -T root
bind-key -T root MouseDown1Pane select-pane -t = \; send-keys -M
bind-key -T root MouseDown2Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { paste-buffer -p }
bind-key -T root MouseDown3Pane if-shell -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M }
bind-key -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }

# A folder's shell turns the status bar on for its own tmux session: one terminal shows every folder's shell, and this
# line says which folder it is on, from the label Aggregor sets on the session.
set -g status-style "fg=brightblack,bg=default"
set -g status-left " #{@aggregor_folder_label} "
set -g status-left-length 200
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""

# The wheel scrolls tmux's history; Shift+drag still selects text in VS Code (Option+drag on macOS, once VS Code's
# terminal.integrated.macOptionClickForcesSelection is on).
set -g mouse on
set -g history-limit 50000

# A drag, a double click and the wheel go through tmux's copy mode, which should not look or act like a mode. Its keys
# are tmux's emacs set whatever $EDITOR names: a stray key does nothing there, where vi's letters move and open prompts.
# The selection is drawn in reverse, which follows any theme, and no position line is drawn over the pane's first row
# (-q: the option is newer than the oldest tmux this file works with).
set -g mode-keys emacs
set -g mode-style reverse
set -gq copy-mode-position-format ""

# A press that ends in the cell it began in selected nothing, so it copies nothing over the clipboard. A tmux without
# the selection's position leaves it empty, and then the drag copies as before.
bind-key -T copy-mode MouseDragEnd1Pane if-shell -F "#{&&:#{&&:#{!=:#{selection_start_x},},#{==:#{selection_start_x},#{selection_end_x}}},#{==:#{selection_start_y},#{selection_end_y}}}" { send-keys -X cancel } { send-keys -X copy-pipe-and-cancel }

# A trackpad sends a stream of wheel events where a mouse wheel sends one per notch, and tmux scrolls five lines for
# each, so on macOS each scrolls one.
if-shell '[ "$(uname)" = Darwin ]' {
  bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
  bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
}

# Agents read Escape, focus changes and modified keys straight away.
set -g escape-time 0
set -g focus-events on
set -g extended-keys on

# The tmux window follows the size of the tab attached to it.
set -g window-size latest
set -g aggressive-resize on

# VS Code's terminal draws 24-bit colour, and copies what an agent sends with OSC 52.
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on

# The agent's tmux session ends with it.
set -g remain-on-exit off

# Each new tmux session takes these from the session tab that starts it, so its agent gets the window's own git
# credentials helper, terminal name and colours: tmux's defaults, then what VS Code and its extensions add, then the
# Aggregor session's id.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION GIT_ASKPASS VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_EXTRA_ARGS VSCODE_GIT_IPC_HANDLE VSCODE_IPC_HOOK_CLI CLAUDE_CODE_SSE_PORT ENABLE_IDE_INTEGRATION AGGREGOR_SESSION_ID"
