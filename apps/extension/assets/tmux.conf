# Aggregor's own tmux server (on <aggregor folder>/tmux.sock) reads this file instead of ~/.tmux.conf. Each tmux session
# holds one Aggregor session's agent, and the session's VS Code tab is a tmux client attached to it.

# No prefix and no status bar: the tab should feel like the agent alone.
set -g prefix None
unbind-key C-b
set -g status off

# The wheel scrolls tmux's history; Shift+drag still selects text in VS Code.
set -g mouse on
set -g history-limit 50000

# Agents read Escape, focus changes and modified keys straight away.
set -g escape-time 0
set -g focus-events on
set -g extended-keys on

# The tmux window follows the size of the tab attached to it.
set -g window-size latest
set -g aggressive-resize on

# VS Code's terminal draws 24-bit colour, and copies what an agent sends with OSC 52.
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on

# The agent's tmux session ends with it.
set -g remain-on-exit off

# Each new tmux session takes these from the session tab that starts it, so its agent gets the window's own git
# credentials helper, terminal name and colours: tmux's defaults, then what VS Code and its extensions add, then the
# Aggregor session's id.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION GIT_ASKPASS VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_EXTRA_ARGS VSCODE_GIT_IPC_HANDLE VSCODE_IPC_HOOK_CLI CLAUDE_CODE_SSE_PORT ENABLE_IDE_INTEGRATION AGGREGOR_SESSION_ID"
